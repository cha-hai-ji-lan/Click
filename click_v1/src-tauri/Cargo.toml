[package]
name = "click_v1"
version = "0.1.0"
description = "Click APP"
authors = ["ChaHaiJiLan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "click_v1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = ["tray-icon"] }
tauri-plugin-opener = "2"  # opener plugin 用于 访问系统浏览器。允许你的进程并管理文件和URL使用他们的默认浏览器。
serde_json = "1"
tauri-plugin-shell = "2"  # shell plugin 用于 访问系统shell。允许你的进程并管理文件和URL使用他们的默认应用程序。
open = "5.3.3"  # open crate用于在某些应用程序中打开给定路径或 URL，遵循当前用户的桌面默认·浏览器配置
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }
#winapi = { version = "0.3.9", features = ["libloaderapi", "winnt", "minwindef"] }
tauri-plugin-dialog = "2.6.0"
chrono = "0.4.19"# chrono 用于处理日期和时间。
percent-encoding = "2.3.2"
tokio = "1.48.0"
